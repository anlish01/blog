# ============================================================
# 轻语博客 · GitHub Actions 自动部署到 Cloudflare Workers
# ------------------------------------------------------------
# 部署目标：Cloudflare Workers（域名 kejiland.azhz.workers.dev
#   → 默认 worker 名 kejiland；Secrets 设置 PAGES_PROJECT_NAME 可覆盖）
# 敏感数据全部存放在 GitHub Secrets，部署时注入：
#   · PAGES_PROJECT_NAME  （可选）自定义 worker 名；不设置 = 用 wrangler.workers.toml 的 name
#   · BLOG_KV_ID          → 部署前替换进 wrangler.workers.toml 的 [[kv_namespaces]] id
#                          （wrangler 对 kv id 不支持 {env.} 内插，用 python3 显式替换）
#   · BLOG_ADMIN_SETUP_KEY→ 首次设置管理员密码的一次性密钥（部署后写入 secret）
#   · BLOG_WRITE_TOKEN    →（可选）旧式写入令牌
#   · CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID → wrangler 部署凭证
#   · SITE_URL  （可选，强烈建议）站点对外域名 https://你的域名，用于收紧 CORS 为仅允许本站
#   · CF_ZONE_ID（可选）自定义域名的 Zone ID，配合 CF_API_TOKEN 实现「发布即清边缘缓存」
#       （两者均缺失时自动降级为空，不影响部署；SITE_URL 缺失时 CORS 回退为回显来源）
# 触发：push 到 main / 手动运行。
# ============================================================
name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch: # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check required secrets
        env:
          BLOG_KV_ID: ${{ secrets.BLOG_KV_ID }}
          BLOG_D1_ID: ${{ secrets.BLOG_D1_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          MISSING=""
          for v in BLOG_KV_ID BLOG_D1_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then MISSING="$MISSING $v"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::缺少必要的 GitHub Secrets:$MISSING"
            echo "请到 仓库 Settings → Secrets and variables → Actions 添加后重试。"
            exit 1
          fi
          echo "✅ 必要 Secrets 齐全（值不会打印）"

      # 诊断：验证凭证账户，便于定位 8000007 类错误
      - name: Diagnose account & worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== 账户 $CLOUDFLARE_ACCOUNT_ID ==="
          npx --yes wrangler@3.90.0 whoami 2>&1 | head -20 || true

      # 生成带真实 KV id 的部署配置（wrangler 对 kv 的 id 不支持 {env.} 内插，
      # 必须显式替换占位符；文件放在仓库根目录，保证 worker.js/public 的相对路径正确）
      - name: Prepare deploy config with real KV id
        env:
          BLOG_KV_ID: ${{ secrets.BLOG_KV_ID }}
          BLOG_D1_ID: ${{ secrets.BLOG_D1_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          python3 - <<'PY'
          import os
          kv_id = os.environ['BLOG_KV_ID'].strip()
          if not kv_id or len(kv_id) != 32 or not all(c in '0123456789abcdef' for c in kv_id.lower()):
              print('::error::BLOG_KV_ID 不是有效的 32 位十六进制 KV id（去除多余空格/换行后重试）')
              raise SystemExit(1)
          src = open('wrangler.workers.toml', encoding='utf-8').read()
          dst = src.replace('{env.BLOG_KV_ID}', kv_id)
          # D1 database_id 是 UUID（如 0fa366ac-f04a-4be2-8e11-5adc6ee6d686），与 KV 的 32 位十六进制不同
          import re
          d1_raw = os.environ['BLOG_D1_ID'].strip().strip('"').strip("'")
          if not re.fullmatch(r'[0-9a-fA-F]{32}', d1_raw.replace('-', '')):
              print('::error::BLOG_D1_ID 不是有效的 D1 database_id（UUID 格式，见 D1 数据库详情页；不是数据库名，也不是 KV 的 ID）')
              raise SystemExit(1)
          dst = dst.replace('{env.BLOG_D1_ID}', d1_raw)
          # 非敏感变量：缺失则替换为空字符串（安全降级，不会留下字面量占位符）
          dst = dst.replace('{env.SITE_URL}', os.environ.get('SITE_URL', '').strip())
          dst = dst.replace('{env.CF_ZONE_ID}', os.environ.get('CF_ZONE_ID', '').strip())
          open('wrangler.workers.ci.toml', 'w', encoding='utf-8').write(dst)
          print('✅ 部署配置已生成（含真实 KV id 与 D1 id，不会打印）')
          PY

      # 部署前应用 D1 表结构（幂等：CREATE TABLE IF NOT EXISTS，按序执行 migrations/*.sql）。
      # 需先在 Cloudflare 创建名为 blog 的 D1 数据库，并把其 database_id 填入 Secret BLOG_D1_ID。
      - name: Apply D1 schema (migrations/*.sql)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BLOG_D1_ID: ${{ secrets.BLOG_D1_ID }}
        run: |
          # 查询某表是否存在指定列（用于 ALTER 类迁移的幂等跳过）
          check_col() {
            local tbl="$1" col="$2"
            npx --yes wrangler@3.90.0 d1 execute blog --remote --config wrangler.workers.ci.toml \
              --command "SELECT COUNT(*) AS n FROM pragma_table_info('$tbl') WHERE name='$col'" --json 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['results'][0]['n'] if d and d[0].get('results') else 0)" 2>/dev/null || echo 0
          }
          for f in migrations/*.sql; do
            echo "Applying $f"
            base=$(basename "$f")
            skip=0
            # ALTER 加列类迁移幂等：先查列是否存在，存在则跳过，
            # 避免重复执行 ALTER TABLE ADD COLUMN 报 duplicate column（SQLite 无 IF NOT EXISTS）
            case "$base" in
              0003_cover_column.sql)    [ "$(check_col posts cover)" -gt 0 ] 2>/dev/null && skip=1 ;;
              0004_post_meta.sql)       [ "$(check_col posts category)" -gt 0 ] 2>/dev/null && skip=1 ;;
              0005_comment_status.sql)  [ "$(check_col comments status)" -gt 0 ] 2>/dev/null && skip=1 ;;
              0010_admin_must_change.sql) [ "$(check_col admin_auth must_change)" -gt 0 ] 2>/dev/null && skip=1 ;;
              # 0009 使用 CREATE INDEX IF NOT EXISTS，天然幂等，不跳过
            esac
            if [ "$skip" -eq 1 ]; then
              echo "→ 列已存在，跳过（幂等）"
              continue
            fi
            out=$(npx --yes wrangler@3.90.0 d1 execute blog --remote --config wrangler.workers.ci.toml --file="$f" 2>&1)
            code=$?
            if [ $code -ne 0 ]; then
              # 兜底：万一上面的列查询不可用（如 D1 不支持 pragma_table_info），
              # 仍按错误文本识别 duplicate column 并跳过
              if echo "$out" | grep -qi "duplicate column"; then
                echo "→ 列已存在，跳过（幂等）"
              else
                echo "$out"; exit 1
              fi
            fi
          done

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy
            --config wrangler.workers.ci.toml
            ${{ secrets.PAGES_PROJECT_NAME != '' && format('--name {0}', secrets.PAGES_PROJECT_NAME) || '' }}

      # 部署后写入运行时 secret（独立 step：secret 经 env 传入，shell 内用 $VAR 引用，
      # 不直接把 secret 值拼进脚本，避免值里含换行/特殊字符时破坏语法）
      - name: Write runtime secrets to Worker
        env:
          BLOG_ADMIN_SETUP_KEY: ${{ secrets.BLOG_ADMIN_SETUP_KEY }}
          BLOG_WRITE_TOKEN: ${{ secrets.BLOG_WRITE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NAME_ARG: ${{ secrets.PAGES_PROJECT_NAME != '' && format('--name {0}', secrets.PAGES_PROJECT_NAME) || '' }}
        run: |
          if [ -n "$BLOG_ADMIN_SETUP_KEY" ]; then
            echo "$BLOG_ADMIN_SETUP_KEY" | npx --yes wrangler@3.90.0 secret put BLOG_ADMIN_SETUP_KEY --config wrangler.workers.ci.toml $NAME_ARG
          fi
          if [ -n "$BLOG_WRITE_TOKEN" ]; then
            echo "$BLOG_WRITE_TOKEN" | npx --yes wrangler@3.90.0 secret put BLOG_WRITE_TOKEN --config wrangler.workers.ci.toml $NAME_ARG
          fi
          # CF_API_TOKEN 同时作为「发布即清缓存」的运行时凭证（purgeTags 需要 Zone·Cache Purge 权限）
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "$CLOUDFLARE_API_TOKEN" | npx --yes wrangler@3.90.0 secret put CF_API_TOKEN --config wrangler.workers.ci.toml $NAME_ARG
          fi
          rm -f wrangler.workers.ci.toml
