# ============================================================
# 轻语博客 · GitHub Actions 自动部署到 Cloudflare Pages
# ------------------------------------------------------------
# 为什么用 Actions：原生 Pages「Git 连接」无法读取 GitHub Secrets。
# 本仓库的敏感数据（KV 命名空间 id、设置密钥、写入令牌等）
# 全部存放在 GitHub Secrets，部署时由本工作流注入：
#   · BLOG_KV_ID          → wrangler.toml 中 [[kv_namespaces]] 的 id（{env.} 内插）
#   · BLOG_ADMIN_SETUP_KEY→ 首次设置管理员密码的一次性密钥（运行时/环境变量）
#   · BLOG_WRITE_TOKEN    →（可选）旧式写入令牌
#   · CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID → wrangler 部署凭证
# 触发：push 到 main / 手动运行。
# ============================================================
name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:      # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check required secrets
        env:
          PAGES_PROJECT_NAME: ${{ secrets.PAGES_PROJECT_NAME }}
          BLOG_KV_ID: ${{ secrets.BLOG_KV_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          MISSING=""
          for v in PAGES_PROJECT_NAME BLOG_KV_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then MISSING="$MISSING $v"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::缺少必要的 GitHub Secrets:$MISSING"
            echo "请到 仓库 Settings → Secrets and variables → Actions 添加后重试。"
            exit 1
          fi
          echo "✅ 必要 Secrets 齐全（值不会打印）"

      - name: Deploy Pages (with secrets injected)
        uses: cloudflare/wrangler-action@v3
        env:
          # 从 GitHub Secrets 注入：wrangler.toml 的 {env.BLOG_KV_ID} 由 wrangler 内插（读进程环境变量）
          BLOG_KV_ID: ${{ secrets.BLOG_KV_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 显式上传 public/（目录作为参数），分支 main=生产环境。
          # ⚠️ 项目名必须用 GitHub 表达式 ${{ }} 在 YAML 层内联展开——
          #    wrangler-action 执行 command 时不经过 shell，$VAR 不会被展开（会原样传给 wrangler）。
          command: >-
            pages deploy public
            --project-name=${{ secrets.PAGES_PROJECT_NAME }}
            --branch=main
          # 部署后再把运行时敏感变量写入 Pages 项目（secrets 持久化、不入仓库）。
          # postCommands 里同样用 ${{ }} 展开项目名；GitHub Secrets 为空的条目自动跳过。
          postCommands: |
            if [ -n "${{ secrets.BLOG_ADMIN_SETUP_KEY }}" ]; then
              echo "${{ secrets.BLOG_ADMIN_SETUP_KEY }}" | wrangler pages secret put BLOG_ADMIN_SETUP_KEY --project-name=${{ secrets.PAGES_PROJECT_NAME }}
            fi
            if [ -n "${{ secrets.BLOG_WRITE_TOKEN }}" ]; then
              echo "${{ secrets.BLOG_WRITE_TOKEN }}" | wrangler pages secret put BLOG_WRITE_TOKEN --project-name=${{ secrets.PAGES_PROJECT_NAME }}
            fi