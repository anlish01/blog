# ============================================================
# 轻语博客 · GitHub Actions 自动部署到 Cloudflare Workers
# ------------------------------------------------------------
# 部署目标：Cloudflare Workers（子域名 azhz.workers.dev → 默认 worker 名 azhz）
# 敏感数据全部存放在 GitHub Secrets，部署时注入：
#   · PAGES_PROJECT_NAME  （可选）自定义 worker 名；不设置 = 用 wrangler.workers.toml 的 name
#   · BLOG_KV_ID          → 部署前替换进 wrangler.workers.toml 的 [[kv_namespaces]] id
#                          （wrangler 对 kv id 不支持 {env.} 内插，用 sed 显式替换）
#   · BLOG_ADMIN_SETUP_KEY→ 首次设置管理员密码的一次性密钥（部署后写入 secret）
#   · BLOG_WRITE_TOKEN    →（可选）旧式写入令牌
#   · CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID → wrangler 部署凭证
# 触发：push 到 main / 手动运行。
# ============================================================
name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:      # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check required secrets
        env:
          BLOG_KV_ID: ${{ secrets.BLOG_KV_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          MISSING=""
          for v in BLOG_KV_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then MISSING="$MISSING $v"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::缺少必要的 GitHub Secrets:$MISSING"
            echo "请到 仓库 Settings → Secrets and variables → Actions 添加后重试。"
            exit 1
          fi
          echo "✅ 必要 Secrets 齐全（值不会打印）"

      # 诊断：验证凭证账户，便于定位 8000007 类错误
      - name: Diagnose account & worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== 账户 $CLOUDFLARE_ACCOUNT_ID ==="
          npx --yes wrangler@3.90.0 whoami 2>&1 | head -20 || true

      # 生成带真实 KV id 的部署配置（wrangler 对 kv 的 id 不支持 {env.} 内插，
      # 必须显式替换占位符；生成在 /tmp，不落仓库）
      - name: Prepare deploy config with real KV id
        env:
          BLOG_KV_ID: ${{ secrets.BLOG_KV_ID }}
        run: |
          sed "s|{env.BLOG_KV_ID}|${BLOG_KV_ID}|g" wrangler.workers.toml > /tmp/wrangler.workers.ci.toml
          if grep -q '{env.BLOG_KV_ID}' /tmp/wrangler.workers.ci.toml; then
            echo "::error::KV 占位符未替换，请确认 BLOG_KV_ID Secret 已设置"
            exit 1
          fi
          echo "✅ 部署配置已生成（含真实 KV id，不会打印）"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy
            --config /tmp/wrangler.workers.ci.toml
            ${{ secrets.PAGES_PROJECT_NAME != '' && format('--name {0}', secrets.PAGES_PROJECT_NAME) || '' }}
          # 部署后写入运行时 secret（wrangler secret put 对 Worker 有效）
          postCommands: |
            if [ -n "${{ secrets.BLOG_ADMIN_SETUP_KEY }}" ]; then
              echo "${{ secrets.BLOG_ADMIN_SETUP_KEY }}" | wrangler secret put BLOG_ADMIN_SETUP_KEY --config /tmp/wrangler.workers.ci.toml ${{ secrets.PAGES_PROJECT_NAME != '' && format('--name {0}', secrets.PAGES_PROJECT_NAME) || '' }}
            fi
            if [ -n "${{ secrets.BLOG_WRITE_TOKEN }}" ]; then
              echo "${{ secrets.BLOG_WRITE_TOKEN }}" | wrangler secret put BLOG_WRITE_TOKEN --config /tmp/wrangler.workers.ci.toml ${{ secrets.PAGES_PROJECT_NAME != '' && format('--name {0}', secrets.PAGES_PROJECT_NAME) || '' }}
            fi