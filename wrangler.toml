# ============================================================
# 轻语博客 · Cloudflare Pages 配置（Git 连接 / wrangler pages dev 用）
# ------------------------------------------------------------
# 注意：Cloudflare Pages 会自动读取本文件（BETA 功能）。
# 这里只放 Pages 支持的字段；Workers 专属配置（main / [assets]）
# 已拆到 wrangler.workers.toml，避免 Pages 报错
# （例如 'ASSETS' 是 Pages 项目的保留名，不能用作 assets binding 名）。
# ------------------------------------------------------------
# · Pages 部署（Git 连接）：仓库根目录有此文件即可，
#   构建输出目录 public/，functions/ 自动打包成 Pages Functions。
# · 本地预览：npx wrangler pages dev
# ============================================================
name = "qingyu-blog"
compatibility_date = "2025-02-01"

# Cloudflare Pages：静态资源目录（也是构建输出目录）
pages_build_output_dir = "public"

# KV 命名空间（云端写文章存储；可选）
# 两种绑定方式任选其一：
#   a) 在 Pages 控制台 → Settings → Bindings 添加 KV 命名空间（变量名 BLOG）
#   b) 把下方占位符换成真实 id（npx wrangler kv namespace create BLOG 的输出）
# 注意：占位符 id 会让 Pages 构建失败，未创建真实命名空间前请保持整段注释。
# [[kv_namespaces]]
# binding = "BLOG"
# id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"